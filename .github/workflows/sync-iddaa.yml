name: 7/24 İddaa Kapanış Oranı ve Maç Sonucu Kaydedici

on:
  schedule:
    # 7/24 her 20 dakikada bir otomatik çalışır
    - cron: '*/20 * * * *'
  workflow_dispatch: # GitHub arayüzünden ve cron-job.org üzerinden tetikleme desteği

permissions:
  contents: write

# Aynı anda iki botun çakışmasını (merge conflict) engeller, sırayla çalıştırır
concurrency:
  group: sync-iddaa-archive
  cancel-in-progress: false

jobs:
  sync-matches:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir (Checkout)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: En Güncel Veritabanını Çek
        run: git pull origin main --no-edit

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: İddaa Bültenini ve Biten Maç Skorlarını Çek
        run: node backend/sync-cli.js

      - name: Güncellenen Veritabanını GitHub'a Kaydet
        run: |
          git config user.name "OranAnaliz Bot"
          git config user.email "bot@orananaliz.local"
          git add backend/data/matches.json
          if git diff --staged --quiet; then
            echo "Veritabanında değişiklik yok."
          else
            git commit -m "Otomatik Bülten & Kapanış Oranı Güncellemesi ($(date -u +'%d.%m.%Y %H:%M UTC'))"
            if ! git push origin HEAD:main; then
              echo "Uzak depoda yeni kayıt var, yeniden birleştiriliyor..."
              git reset --hard origin/main
              git pull origin main --no-edit
              node backend/sync-cli.js
              git add backend/data/matches.json
              git commit -m "Otomatik Bülten & Kapanış Oranı Güncellemesi ($(date -u +'%d.%m.%Y %H:%M UTC'))" || true
              git push origin HEAD:main
            fi
          fi
